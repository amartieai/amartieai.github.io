<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORACLE — Cover Page</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #07080b;
    overflow: hidden;
    font-family: 'Cormorant Garamond', 'DejaVu Serif', serif;
  }

  canvas { display: block; }

  /* ---- Background atmosphere ---- */
  .bg {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #0f1218 0%, #07080b 70%);
  }

  /* ---- Subtle grid ---- */
  .grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(232,184,109,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,184,109,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    0% { transform: translate(0,0); }
    100% { transform: translate(60px,60px); }
  }

  /* ---- Left panel (hunter) ---- */
  .left-panel {
    position: fixed; left: 4%; top: 5%; bottom: 5%; width: 46%;
    background: linear-gradient(135deg, #0a0d12 0%, #0f141a 100%);
    border: 1px solid rgba(232,184,109,0.1);
    border-radius: 8px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 40px;
    transition: border-color 1s;
  }
  .left-panel::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(255,77,90,0.05) 0%, transparent 50%);
    border-radius: 8px; pointer-events: none;
  }
  .left-label {
    font-size: 14px; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(255,77,90,0.6); margin-bottom: 20px;
    font-family: 'Cormorant Garamond', serif; font-weight: 400;
  }
  .left-title {
    font-size: 28px; color: rgba(232,184,109,0.3);
    text-align: center; line-height: 1.3;
  }

  /* ---- Right panel (the know) ---- */
  .right-panel {
    position: fixed; right: 4%; top: 5%; bottom: 5%; width: 46%;
    background: linear-gradient(135deg, #0a0d12 0%, #0f141a 100%);
    border: 1px solid rgba(232,184,109,0.15);
    border-radius: 8px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 40px;
    transition: border-color 1s, box-shadow 1s;
    box-shadow: 0 0 40px rgba(232,184,109,0.05);
  }

  /* ---- Gold divider ---- */
  .divider {
    position: fixed; left: 50%; top: 5%; bottom: 5%; width: 2px;
    background: linear-gradient(180deg, transparent, #e8b86d, transparent);
    box-shadow: 0 0 10px rgba(232,184,109,0.3);
    z-index: 10;
  }

  /* ---- Banner (appears 3-7s) ---- */
  .banner {
    position: absolute; top: 25%; left: 50%; transform: translateX(-50%);
    background: rgba(232,184,109,0.08);
    border: 1px solid rgba(232,184,109,0.4);
    border-radius: 4px;
    padding: 12px 28px;
    text-align: center;
    opacity: 0;
    animation: bannerIn 1.5s ease 3s forwards;
    z-index: 20;
  }
  .banner-title {
    font-size: 18px; letter-spacing: 4px; color: #e8b86d;
    font-weight: 600; text-transform: uppercase;
    text-shadow: 0 0 20px rgba(232,184,109,0.3);
  }
  .banner-time {
    font-size: 14px; color: rgba(232,184,109,0.7);
    margin-top: 4px; font-weight: 400; letter-spacing: 2px;
  }
  @keyframes bannerIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ---- End card (appears 12-15s) ---- */
  .end-card {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: rgba(7,8,11,0.92);
    opacity: 0;
    animation: endCardIn 2s ease 12s forwards;
    z-index: 30;
  }
  .end-card h1 {
    font-size: 42px; color: #e8b86d;
    text-align: center; letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(232,184,109,0.4);
    line-height: 1.4;
  }
  .end-card h1 span {
    display: block; font-size: 20px;
    color: rgba(232,184,109,0.5); margin-top: 12px;
    letter-spacing: 2px; font-weight: 400;
  }
  .end-card .url {
    font-size: 14px; color: rgba(232,184,109,0.3);
    margin-top: 30px; letter-spacing: 1px;
  }
  @keyframes endCardIn {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- Subtle glow pulse on right panel ---- */
  .right-panel::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(232,184,109,0.1), transparent 50%, rgba(232,184,109,0.05));
    z-index: -1; opacity: 0;
    animation: glowPulse 3s ease-in-out 4s infinite;
  }
  @keyframes glowPulse {
    0%,100% { opacity: 0; }
    50% { opacity: 1; }
  }

  /* ---- Vignette ---- */
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(7,8,11,0.8) 100%);
    pointer-events: none; z-index: 5;
  }

  /* ---- Hidden during video ---- */
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="vignette"></div>

  <div class="left-panel">
    <div class="left-label">Lost</div>
    <div class="left-title">THE HUNT</div>
  </div>

  <div class="right-panel" id="rightPanel">
    <div class="left-label" style="color: rgba(232,184,109,0.4);">Settled</div>
    <div class="left-title" id="rightTitle" style="color: rgba(232,184,109,0.2);">THE KNOW</div>
    <div class="banner" id="banner">
      <div class="banner-title">EVENT ALERT</div>
      <div class="banner-time">WINDOW 14:00 · SENT 13:59:12</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="end-card" id="endCard">
    <h1>WE KNOW THE WHEN.<span>YOU DO THE REST.</span></h1>
    <div class="url">amartiecom.com</div>
  </div>

  <script>
    // Hide panels after video ends
    setTimeout(() => {
      document.querySelectorAll('.left-panel, .right-panel, .divider, .banner').forEach(el => {
        el.style.transition = 'opacity 1s';
        el.style.opacity = '0';
      });
    }, 14000);
  </script>
</body>
</html>
